services:
  postgres:
    image: postgres:15-alpine
    container_name: bootah-postgres
    environment:
      POSTGRES_USER: bootah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: bootah
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootah -d bootah"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://bootah:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/bootah
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run db:migrate
    restart: "no"

  bootah:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bootah-app
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://bootah:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/bootah
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      AUTH_MODE: ${AUTH_MODE:-local}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-viewer}
      ENABLE_HOST_LOCAL_IMAGING: "false"
      ENABLE_PXE_NETWORK_SERVICES: "false"
      ENABLE_SCHEDULER_EXECUTION: "false"
      ENABLE_MACHINE_CALLBACKS: "false"
      ENABLE_MULTICAST_EXECUTION: "false"
      ENABLE_FOG_EXECUTION: "false"
      ENABLE_WEBHOOK_DELIVERY: "false"
      ENABLE_OBJECT_PROXY: "false"
      ENABLE_DEMO_MODE: "false"
      ENABLE_WEBSOCKETS: "false"
      PXE_SERVER_IP: ${PXE_SERVER_IP:-192.168.1.50}
      TFTP_PORT: "6969"
      DHCP_PORT: "4067"
      IMAGE_STORAGE_PATH: /app/images
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Bootah <noreply@bootah.local>}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    volumes:
      - bootah_images:/app/images
      - bootah_logs:/app/logs
      - ./pxe-files:/app/pxe-files:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
  bootah_images:
  bootah_logs:
